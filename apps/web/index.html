<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlackMamba Music Encyclopedia</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">BLACKMAMBA MUSIC ENCYCLOPEDIA</p>
      <h1>Encuentra la rola aunque no recuerdes cómo se llamaba.</h1>
      <p class="subtitle">Búsqueda tolerante por título, alias y metadata. No depende del buscador de Suno.</p>
      <div class="search-box">
        <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Ej. durangense, frecuency, kingdom low end…">
        <span id="search-hint">Escribe aunque esté incompleto o mal escrito.</span>
      </div>
      <button id="scan">Escanear biblioteca</button>
    </header>

    <section class="panel">
      <div class="section-title">
        <h2 id="section-label">Biblioteca</h2>
        <span id="status">Cargando…</span>
      </div>
      <div id="tracks" class="tracks"></div>
    </section>
  </main>

  <footer class="player">
    <div>
      <strong id="now-title">Nada reproduciéndose</strong>
      <small id="now-artist">Selecciona una pista</small>
    </div>
    <audio id="audio" controls></audio>
  </footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
