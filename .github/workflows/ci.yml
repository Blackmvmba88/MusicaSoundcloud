name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  database-regression:
    name: SQLite and Suno worker regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify SQLite bootstrap, Suno identity and worker health
        run: >-
          node --test
          tests/database.test.mjs
          tests/content-inbox.test.mjs
          tests/sidecar-identity.test.mjs
          tests/worker-health.test.mjs

  test:
    runs-on: [self-hosted, macOS, ARM64, blackmamba-music]
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar Node.js
        run: node --version

      - name: Instalar reproductor
        run: npm ci --prefix apps/player

      - name: Probar sistema central
        run: npm test

      - name: Validar reproductor
        run: npm run check --prefix apps/player
