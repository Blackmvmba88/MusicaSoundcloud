name: Validación

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/player/package-lock.json

      - name: Instalar reproductor
        run: npm ci --prefix apps/player

      - name: Probar sistema central
        run: npm test

      - name: Validar reproductor
        run: npm run check --prefix apps/player
