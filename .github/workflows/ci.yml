name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64, blackmamba-music]
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar Node.js
        run: node --version

      - name: Instalar reproductor
        run: npm ci --prefix apps/player

      - name: Probar sistema central
        run: npm test

      - name: Validar reproductor
        run: npm run check --prefix apps/player
